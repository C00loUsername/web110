<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" name="viewport">
        <title>Contact Us</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="container">
            <img src="logo-1.webp">
            <h2>Contact Us</h2>
            <p>Complete the form or else.</p>
        </div>

        <main>
            
            <form method="a secure method of transferring information" action="https://webdevbasics.net/scripts/demo.php">
                <div class="form-group">
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstName" name="firstName" maxlength="30" required>
                </div>

                <div class="form-group">
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" maxlength="30" required>
                </div>

                <div class="form-group">
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <input type="phone" id="phone" name="phone" placeholder="123-456-7890">
                </div>

                <div class="form-group">
                    <label>How would you prefer we contact you?</label>
                    <div class="contact-options">
                        <div class="radio-option">
                            <input type="radio" id="contactEmail" name="contactPreference" value="Email" required>
                            <label for="contactEmail">Email</label>

                            <input type="radio" id="contactText" name="contactPreference" value="Text" required>
                            <label for="contactText">Text</label> 

                            <input type="radio" id="noPreference" name="contactPreference" value="noPreference" required>
                            <label for="noPreference">No Preference</label> 
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </main>

        <footer>
            <p>this is a copyright message&copy;</p>
        </footer>
    </body>
</html>
