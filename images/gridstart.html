<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Five places in the US</title>
    <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: linear-gradient(9deg, #d4d2d6, #200b30); /* change this line */
      padding: 15px;
      border: 2px solid #190329;
      border-radius: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      min-height: 100vh;
    }

    h1, h2 {
      font-size: 3vh;
      padding: 2vh;
    }

    h2 {
      border-bottom: 2px solid #0d1363;
      margin-bottom: 10px;
    }

    /* Grid container */
    .grid-wrapper {
      display: grid;
      grid-gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      grid-auto-rows: minmax(250px, auto);
      grid-auto-flow: dense;
    }

    /* Grid item spans */
   .wide{
    grid-column: span 2;
   }

   .tall{
    grid-row: span 2;
   }

   .big{
    grid-column: span 2;
    grid-row: span 2;
   }





    /* Each figure is a grid item */
    figure {
      margin: 0;
      border-radius: 5px;
      overflow: hidden;
      border: 2px solid #190329;
      background-color: #1e176e;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    figure img {
      width: 100%;
      height: auto;
      object-fit: cover;
      flex-grow: 1;
      display: block;
      border-bottom: 1px solid #1e176e;
    }

    figcaption {
      padding: 8px 10px;
      background-color: #200b30;
      color: white;
      font-size: 2.5vh;
      text-align: center;
      flex-shrink: 0;
    }
    </style>
</head>
<body>

  <header>
    <h1>A top 10 list of places to visit in the US according to Travel Advisor</h1>
    <h2>What are your top 10?</h2>
  </header>

  <main>
    <section class="grid-wrapper">
      <figure class="big">
        <img src="coollookingplace1.jpg" alt="cool looking place 1" />
        <figcaption>Cool looking place 1</figcaption>
      </figure>

      <figure>
        <img src="coollookingplace2.jpg" alt="cool looking place 2" class="wide"/>
         <figcaption>Cool looking place 2</figcaption>

      </figure>
      <figure>
        <img src="coollookingplace3.jpg" alt="cool looking place 3" />
          <figcaption>Cool looking place 3</figcaption>
      </figure>

      <figure class="big">
        <img src="coollookingplace4.jpg" alt="cool looking place 4" />
          <figcaption>Cool looking place 4</figcaption>
      </figure>

      <figure class="wide">
        <img src="coollookingplace5.jpg" alt="cool looking place 5" />
        <figcaption>Cool looking place 5</figcaption>
      </figure>

      
    </section>
  </main>

</body>
</html>
